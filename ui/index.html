<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightpost</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav id="rail">
    <div class="logo" title="Lightpost">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
    </div>
    <button data-panel="collections" title="Collections"><svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Collections</span></button>
    <button data-panel="environments" title="Environments"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>Envs</span></button>
    <button data-panel="history" title="History"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>History</span></button>
    <button data-panel="mocks" title="Mock servers"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="1"/><rect x="4" y="14" width="16" height="6" rx="1"/><path d="M8 7h.01M8 17h.01"/></svg><span>Mocks</span></button>
    <button data-panel="monitors" title="Monitors"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Monitors</span></button>
    <div class="grow"></div>
    <button id="btn-cookies" title="Cookies"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 10h.01M14 9h.01M10 15h.01M15 14h.01"/></svg><span>Cookies</span></button>
    <button id="btn-settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg><span>Settings</span></button>
  </nav>
  <aside id="sidebar">
    <div class="side-head">
      <h2 id="side-title">Collections</h2>
      <div class="side-actions" id="side-actions"></div>
    </div>
    <div class="side-search"><input id="side-filter" placeholder="Filter" spellcheck="false"></div>
    <div id="side-body"></div>
  </aside>
  <div id="side-resize"></div>
  <main id="main">
    <header id="topbar">
      <div id="tabs"></div>
      <button class="icon-btn" id="new-tab" title="New request (⌘T)">+</button>
      <div class="grow"></div>
      <div class="env-picker">
        <select id="env-select" title="Active environment"></select>
        <button class="icon-btn" id="env-eye" title="Environment quick look">
          <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="overlay"></div>
<div id="toast"></div>
<script src="util.js"></script>
<script src="codegen.js"></script>
<script src="app.js"></script>
<script src="request.js"></script>
<script src="panels.js"></script>
</body>
</html>
